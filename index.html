<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1565c0">
  <title>FCH App</title>

  <style>
    :root {
      --blue: #1565c0;
      --blue-dark: #0d47a1;
      --blue-soft: #e8f1fc;
      --background: #f3f7fc;
      --card: #ffffff;
      --text: #17211c;
      --muted: #68756e;
      --border: #dce5ef;
      --danger: #b62e2e;
      --success: #198754;
      --warning: #d58900;
      --shadow: 0 8px 25px rgba(16, 55, 100, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button { cursor: pointer; border: 0; }
    button:disabled { cursor: not-allowed; opacity: .45; }

    .app-header {
      padding: 16px;
      color: white;
      background: var(--blue);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .14);
    }

    .header-inner, main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      display: grid;
      min-width: 44px;
      height: 40px;
      padding: 0 6px;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, .16);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .5px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 2px; font-size: 18px; }
    h2 { margin-bottom: 5px; font-size: 22px; }
    h3 { margin-bottom: 12px; font-size: 17px; }
    .brand p { margin: 0; opacity: .8; font-size: 12px; }

    main { padding: 20px 0 40px; }

    .role-select {
      min-width: 200px;
      padding: 8px 10px;
      color: white;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 8px;
      background: rgba(0, 0, 0, .14);
    }

    .role-select option, .role-select optgroup {
      color: var(--text);
      background: white;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 10px 13px;
      color: var(--muted);
      white-space: nowrap;
      background: transparent;
      border-bottom: 3px solid transparent;
      font-weight: 700;
    }

    .tab.active { color: var(--blue); border-color: var(--blue); }

    .panel { display: none; }
    .panel.active { display: block; }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .section-head p { margin-bottom: 0; color: var(--muted); }

    .card {
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .filters, .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-grid.two-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    textarea { resize: vertical; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: 700;
      gap: 6px;
      font-size: 14px;
      text-decoration: none;
    }

    .button-primary { color: white; background: var(--blue); }
    .button-primary:hover { background: var(--blue-dark); }
    .button-secondary { color: var(--blue); background: var(--blue-soft); }
    .button-danger { color: white; background: var(--danger); }

    .small-button {
      padding: 6px 9px;
      color: var(--danger);
      border-radius: 7px;
      background: #fce8e8;
      font-size: 12px;
      font-weight: 700;
    }

    .back-button {
      padding: 0;
      margin-bottom: 12px;
      color: var(--blue);
      background: transparent;
      font-weight: 700;
    }

    .event-list, .admin-list, .module-grid, .assignment-list {
      display: grid;
      gap: 10px;
    }

    .module-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

    .module-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 18px;
      text-align: left;
      color: var(--text);
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .module-card:hover { border-color: var(--blue); background: #fbfdff; }
    .module-card h3 { margin: 0; color: var(--blue); }
    .module-card p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }

    .event-button {
      display: grid;
      grid-template-columns: auto 1fr auto;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 14px;
      color: var(--text);
      text-align: left;
      background: white;
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .event-button:hover { background: #f9fbff; border-color: #7aa7df; }

    .event-date {
      min-width: 48px;
      padding-right: 12px;
      text-align: center;
      border-right: 1px solid var(--border);
    }

    .event-date strong { display: block; font-size: 19px; }
    .event-date span { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .event-name { font-weight: 750; }

    .event-meta, .admin-item-meta, .assignment-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .event-arrow { color: var(--blue); font-size: 22px; }

    .player-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .player-row:last-child, .admin-item:last-child { border-bottom: 0; }
    .player-name { font-weight: 720; }
    .player-note { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .status-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
    }

    .status-button {
      min-width: 34px;
      padding: 7px 8px;
      color: #3e4d44;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #edf1f5;
      font-size: 12px;
      font-weight: 800;
    }

    .status-button.active { color: white; background: var(--status-color); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot-color); }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .metric strong { display: block; color: var(--blue); font-size: 26px; }
    .metric span { color: var(--muted); font-size: 13px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    td:last-child, th:last-child { text-align: right; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 750;
    }

    .badge.good { color: #0d47a1; background: #dceafd; }
    .badge.warn { color: #875700; background: #fff0cd; }
    .badge.bad { color: #9e2626; background: #fde2e2; }

    .admin-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .admin-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .notice {
      margin-bottom: 16px;
      padding: 12px;
      color: #0d47a1;
      border-radius: 8px;
      background: #e8f1fc;
      font-size: 13px;
      line-height: 1.45;
    }

    .empty { padding: 28px; color: var(--muted); text-align: center; }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      padding: 12px 15px;
      color: white;
      border-radius: 9px;
      background: #22354e;
      box-shadow: var(--shadow);
      transform: translateY(90px);
      transition: transform .2s ease;
    }

    .toast.show { transform: translateY(0); }

    .assignment-card {
      padding: 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: opacity .15s ease, background .15s ease;
    }

    .assignment-card.is-past {
      background: #f8fafc;
      border-color: #cbd5e1;
      opacity: 0.72;
    }

    .assignment-card.is-past:hover {
      opacity: 1;
    }

    .assignment-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .assignment-title { margin: 0; font-size: 17px; font-weight: 750; }

    .assignment-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .assignment-status.open { color: #9e2626; background: #fde2e2; }
    .assignment-status.partial { color: #875700; background: #fff0cd; }
    .assignment-status.filled { color: #1b5e20; background: #d4edda; }
    .assignment-status.completed, .assignment-status.cancelled { color: var(--muted); background: #eef1f4; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .assignment-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .assignment-signups {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .assignment-signups ul { margin: 6px 0 0; padding-left: 18px; }
    .assignment-signups li {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .role-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 750;
      background: var(--blue-soft);
      color: var(--blue);
      margin-right: 4px;
    }

    .role-badge.hl {
      background: #fef3c7;
      color: #92400e;
    }

    .overview-share-card {
      background: #fbfdff;
      border: 1px solid #c9def5;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .overview-share-card h4 {
      margin: 0 0 4px 0;
      color: var(--blue);
      font-size: 15px;
    }

    .public-header {
      padding: 24px 16px;
      color: white;
      text-align: center;
      background: var(--blue);
    }

    .public-header .brand-mark {
      margin: 0 auto 12px;
      width: 56px;
      height: 56px;
      font-size: 18px;
      background: rgba(255, 255, 255, .18);
    }

    .public-body {
      width: min(680px, calc(100% - 32px));
      margin: 20px auto 48px;
    }

    .signup-form { display: grid; gap: 12px; margin-top: 14px; }
    .slot-count {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--blue-soft);
      font-size: 13px;
      font-weight: 700;
    }

    .hidden { display: none !important; }

    .admin-manual-form {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: var(--background);
      border: 1px dashed var(--border);
    }

    @media (max-width: 760px) {
      .header-inner, .section-head { align-items: flex-start; flex-direction: column; }
      .header-controls { width: 100%; flex-direction: column; align-items: stretch; }
      .role-select { min-width: 0; }
      .filters, .form-grid, .form-grid.two-columns, .dashboard-grid, .admin-layout {
        grid-template-columns: 1fr;
      }
      .player-row { grid-template-columns: 1fr; }
      .status-group, .assignment-actions { justify-content: flex-start; }
      .brand p { display: none; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      const STORAGE_KEY = "fch-verein-platform-v17";
      const USER_KEY = "fch-simulated-user";
      const ACTIVE_TEAM_KEY = "fch-active-team";

      const statuses = [
        { id: "present", label: "Anwesend", short: "A", color: "#198754", present: true },
        { id: "late", label: "Zu spät", short: "Z", color: "#1575b7", present: true },
        { id: "excused", label: "Entschuldigt", short: "E", color: "#d58900", present: false },
        { id: "missing", label: "Unentschuldigt", short: "U", color: "#d33b3b", present: false },
        { id: "notCalled", label: "Nicht aufgeboten", short: "N", color: "#68756e", present: false },
        { id: "sick", label: "Krank", short: "K", color: "#bd4770", present: false },
        { id: "injured", label: "Verletzt", short: "V", color: "#6c55ad", present: false },
        { id: "holiday", label: "Ferien", short: "F", color: "#0d8491", present: false }
      ];

      const moduleConfig = {
        "awk-junioren": {
          title: "AWK Junioren",
          subtitle: "Anwesenheitskontrolle der Juniorenteams",
          icon: "👟",
          type: "attendance",
          teamType: "junioren"
        },
        "d-schiris": {
          title: "D Junioren Schiris",
          subtitle: "Schiedsrichtereinsätze für D Spiele",
          icon: "📣",
          type: "assignments",
          category: "D Junioren Schiris"
        },
        "fsa-helfer": {
          title: "FSA Helfer",
          subtitle: "Helfer für Trainings der Fussballschule",
          icon: "🎽",
          type: "assignments",
          category: "FSA Helfer"
        },
        "turnier": {
          title: "Turnier Betreuer",
          subtitle: "Schichten und Aufgaben an Turnieren",
          icon: "🏆",
          type: "assignments",
          category: "Turnier"
        },
        "awk-aktive": {
          title: "AWK Aktive",
          subtitle: "Anwesenheitskontrolle der Aktiven Mannschaften",
          icon: "⚽",
          type: "attendance",
          teamType: "aktive"
        },
        "events": {
          title: "Events",
          subtitle: "Helfer bei Vereinsanlässen",
          icon: "🎉",
          type: "assignments",
          category: "Events"
        }
      };

      const defaultData = {
        teams: [
          { id: "d9", name: "D9 Junioren", trainer: "Keller Marco", type: "junioren" },
          { id: "e", name: "E Junioren", trainer: "Meier Sandro", type: "junioren" },
          { id: "aktive1", name: "1. Mannschaft", trainer: "Brunner Thomas", type: "aktive" },
          { id: "aktive2", name: "2. Mannschaft", trainer: "Gerber Stefan", type: "aktive" }
        ],
        contacts: [
          { id: "c1", name: "Keller Marco" },
          { id: "c2", name: "Meier Sandro" }
        ],
        players: [
          { id: "p1", teamId: "d9", name: "Frei Liam", type: "junioren" },
          { id: "p2", teamId: "d9", name: "Müller Noah", type: "junioren" },
          { id: "p3", teamId: "e", name: "Weber Elia", type: "junioren" },
          { id: "a1", teamId: "aktive1", name: "Meier Lukas", type: "aktive" },
          { id: "a2", teamId: "aktive1", name: "Keller Jonas", type: "aktive" },
          { id: "a3", teamId: "aktive2", name: "Fischer Marc", type: "aktive" }
        ],
        events: [],
        attendance: {},
        assignments: [
          {
            id: "asg-1",
            title: "D9 weiss vs. FC Uster",
            category: "D Junioren Schiris",
            date: new Date(Date.now() + 86400000 * 3).toISOString().slice(0, 10),
            time: "10:00",
            neededCount: 1,
            contactName: "Keller Marco",
            status: "open",
            linkToken: "d9-spiel-1"
          },
          {
            id: "asg-2",
            title: "FSA Training",
            category: "FSA Helfer",
            date: new Date(Date.now() + 86400000 * 2).toISOString().slice(0, 10),
            neededHauptleitung: 1,
            neededHelfer: 3,
            status: "open",
            linkToken: "fsa-training-1"
          }
        ],
        assignmentSignups: []
      };

      const $ = (selector, context = document) => context.querySelector(selector);
      const $$ = (selector, context = document) => [...context.querySelectorAll(selector)];

      const state = {
        currentUser: localStorage.getItem(USER_KEY) || "juko",
        activeModule: "dashboard",
        activeTeamId: localStorage.getItem(ACTIVE_TEAM_KEY) || "",
        activeEventId: null,
        data: loadData()
      };

      const broadcast = typeof BroadcastChannel !== "undefined"
        ? new BroadcastChannel("fch-platform")
        : null;

      function loadData() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY))
            || JSON.parse(localStorage.getItem("fch-verein-platform-v16"))
            || JSON.parse(localStorage.getItem("fch-verein-platform-v15"))
            || JSON.parse(localStorage.getItem("fch-verein-platform-v14"));

          if (saved && Array.isArray(saved.teams) && Array.isArray(saved.players)) {
            saved.events ||= [];
            saved.attendance ||= {};
            saved.assignments ||= defaultData.assignments;
            saved.assignmentSignups ||= [];
            saved.contacts ||= defaultData.contacts;
            return saved;
          }
        } catch {}
        return structuredClone(defaultData);
      }

      function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      }

      function createId(prefix) {
        return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function escapeHtml(value) {
        const el = document.createElement("span");
        el.textContent = String(value || "");
        return el.innerHTML;
      }

      function normalizeText(value) {
        return String(value || "").trim().toLocaleLowerCase("de-CH").replace(/\s+/g, " ");
      }

      function currentDate() {
        return new Date().toISOString().slice(0, 10);
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat("de-CH", {
          weekday: "short",
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }).format(new Date(`${date}T12:00:00`));
      }

      function getStatus(statusId) {
        return statuses.find(status => status.id === statusId);
      }

      function teamName(id) {
        return state.data.teams.find(t => t.id === id)?.name || "Ohne Team";
      }

      function getTrainerTeam() {
        if (state.currentUser.startsWith("trainer_")) {
          const teamId = state.currentUser.replace("trainer_", "");
          return state.data.teams.find(t => t.id === teamId) || null;
        }
        return null;
      }

      function isJuKo() { return state.currentUser === "juko"; }
      function isAdminAktive() { return state.currentUser === "admin_aktive"; }
      function isAdminEvents() { return state.currentUser === "admin_events"; }
      function isAnyAdmin() {
        return isJuKo() || isAdminAktive() || isAdminEvents();
      }

      function canAccessModule(moduleId) {
        const trainerTeam = getTrainerTeam();
        if (trainerTeam) {
          if (trainerTeam.type === "junioren") return moduleId === "awk-junioren";
          if (trainerTeam.type === "aktive") return moduleId === "awk-aktive";
          return false;
        }

        if (isJuKo()) {
          return ["awk-junioren", "d-schiris", "fsa-helfer", "turnier"].includes(moduleId);
        }

        if (isAdminAktive()) {
          return moduleId === "awk-aktive";
        }

        if (isAdminEvents()) {
          return moduleId === "events";
        }

        return false;
      }

      function getAllowedTeamIds(type) {
        const trainerTeam = getTrainerTeam();
        if (trainerTeam) return trainerTeam.type === type ? [trainerTeam.id] : [];
        if (isJuKo() && type === "junioren") return state.data.teams.filter(t => t.type === "junioren").map(t => t.id);
        if (isAdminAktive() && type === "aktive") return state.data.teams.filter(t => t.type === "aktive").map(t => t.id);
        return [];
      }

      function hasAttendanceEntriesForEvent(eventId) {
        const att = state.data.attendance[eventId];
        return att ? Object.values(att).some(Boolean) : false;
      }

      function hasAttendanceEntriesForPlayer(playerId) {
        return Object.values(state.data.attendance).some(att => Boolean(att[playerId]));
      }

      function renderApp() {
        if (isPublicRoute()) {
          $("#root").innerHTML = `<div id="publicContent"></div>`;
          renderPublicRoute();
          return;
        }

        const trainerTeam = getTrainerTeam();
        if (trainerTeam) state.activeTeamId = trainerTeam.id;

        $("#root").innerHTML = `
          <header class="app-header">
            <div class="header-inner">
              <div class="brand">
                <div class="brand-mark">FCH</div>
                <div>
                  <h1 id="headerTitle">FCH App</h1>
                  <p id="headerSubtitle">Modulauswahl</p>
                </div>
              </div>

              <div class="header-controls">
                <select class="role-select" id="userSelect" aria-label="Angemeldete Person">
                  <optgroup label="Leitung">
                    <option value="juko" ${state.currentUser === "juko" ? "selected" : ""}>Admin JuKo</option>
                    <option value="admin_aktive" ${state.currentUser === "admin_aktive" ? "selected" : ""}>Admin Aktive</option>
                    <option value="admin_events" ${state.currentUser === "admin_events" ? "selected" : ""}>Admin Events</option>
                  </optgroup>
                  <optgroup label="Trainer Junioren">
                    ${state.data.teams.filter(t => t.type === "junioren").map(t => `
                      <option value="trainer_${t.id}" ${state.currentUser === `trainer_${t.id}` ? "selected" : ""}>Trainer: ${escapeHtml(t.trainer)} (${escapeHtml(t.name)})</option>
                    `).join("")}
                  </optgroup>
                  <optgroup label="Trainer Aktive">
                    ${state.data.teams.filter(t => t.type === "aktive").map(t => `
                      <option value="trainer_${t.id}" ${state.currentUser === `trainer_${t.id}` ? "selected" : ""}>Trainer: ${escapeHtml(t.trainer)} (${escapeHtml(t.name)})</option>
                    `).join("")}
                  </optgroup>
                </select>

                <select class="role-select hidden" id="teamSelect" aria-label="Team auswählen"></select>

              </div>
            </div>
          </header>

          <main>
            <div id="moduleContent"></div>
          </main>
        `;

        setupGlobalEvents();

        if (state.activeModule === "dashboard" || !canAccessModule(state.activeModule)) {
          renderDashboard();
        } else {
          renderModule(state.activeModule);
        }
      }

      function setupGlobalEvents() {
        $("#userSelect").addEventListener("change", event => {
          state.currentUser = event.target.value;
          localStorage.setItem(USER_KEY, state.currentUser);

          const trainerTeam = getTrainerTeam();
          if (trainerTeam) {
            state.activeTeamId = trainerTeam.id;
            localStorage.setItem(ACTIVE_TEAM_KEY, state.activeTeamId);
            state.activeModule = trainerTeam.type === "junioren" ? "awk-junioren" : "awk-aktive";
          } else {
            state.activeTeamId = "";
            localStorage.removeItem(ACTIVE_TEAM_KEY);
            state.activeModule = "dashboard";
          }

          renderApp();
        });

        $("#homeButton").addEventListener("click", () => {
          state.activeModule = "dashboard";
          renderApp();
        });

        const teamSelect = $("#teamSelect");
        teamSelect.addEventListener("change", event => {
          state.activeTeamId = event.target.value;
          localStorage.setItem(ACTIVE_TEAM_KEY, state.activeTeamId);
          renderModule(state.activeModule);
        });
      }

      function renderDashboard() {
        state.activeModule = "dashboard";
        $("#headerTitle").textContent = "FCH App";
        $("#headerSubtitle").textContent = "Modulauswahl";
        $("#teamSelect").classList.add("hidden");

        const modules = Object.entries(moduleConfig).filter(([id]) => canAccessModule(id));

        $("#moduleContent").innerHTML = `
          <div class="section-head">
            <div>
              <h2>Verfügbare Module</h2>
              <p>Wähle einen Bereich zum Starten aus.</p>
            </div>
          </div>

          <div class="module-grid">
            ${modules.map(([id, config]) => `
              <div class="module-card">
                <h3>${config.icon} ${config.title}</h3>
                <p>${config.subtitle}</p>
                <button class="button button-primary open-module-btn" data-module="${id}">Öffnen</button>
              </div>
            `).join("")}
          </div>
        `;

        $$(".open-module-btn").forEach(button => {
          button.addEventListener("click", () => {
            state.activeModule = button.dataset.module;
            renderModule(state.activeModule);
          });
        });
      }

      function renderModule(moduleId) {
        state.activeModule = moduleId;
        const config = moduleConfig[moduleId];

        if (!config || !canAccessModule(moduleId)) {
          renderDashboard();
          return;
        }

        $("#headerTitle").textContent = config.title;
        $("#headerSubtitle").textContent = config.subtitle;

        if (config.type === "attendance") {
          renderAttendanceModule(moduleId, config);
        } else if (config.type === "assignments") {
          renderAssignmentsModule(moduleId, config);
        }
      }

      /* ATTENDANCE MODULE */

          state.activeTeamId = trainerTeam.id;

            <option value="${id}" ${id === state.activeTeamId ? "selected" : ""}>${escapeHtml(teamName(id))}</option>

        $("#moduleContent").innerHTML = `

              <h3>Neuen Spieler erfassen</h3>
              <form id="playerForm">

                    Nachname Vorname

                  ${!trainerTeam ? `
                    <label>
                      Team
                      <select id="newPlayerTeam" required>
                        ${allowedTeams.map(id => `<option value="${id}">${escapeHtml(teamName(id))}</option>`).join("")}
                      </select>

                  ` : ""}

                <button class="button button-primary" type="submit">Spieler hinzufügen</button>

              ${canCreateTeam ? `

          ${canCreateTeam ? `
            <section class="panel" id="teams">
              <div class="section-head">

                  <h2>Teams verwalten</h2>

                </div>
              </div>

              <div class="card">
                <h3>Neues Team eröffnen</h3>
                <p class="admin-item-meta" style="margin-bottom:12px">Neu eröffnete Teams erscheinen sofort in allen Auswahlen.</p>

                  <div class="form-grid two-columns">

                      Teamname

        setupAttendanceEvents(moduleId, type, allowedTeams);
        renderEvents(type, allowedTeams);

      function setupAttendanceEvents(moduleId, type, allowedTeams) {
        $$(".tab").forEach(tab => {
          tab.addEventListener("click", () => {
            $$(".panel").forEach(p => p.classList.toggle("active", p.id === tab.dataset.tab));
            $$(".tab").forEach(t => t.classList.toggle("active", t === tab));

            if (tab.dataset.tab === "events") renderEvents(type, allowedTeams);
            if (tab.dataset.tab === "dashboard") renderAttendanceDashboard(type, allowedTeams);
            if (tab.dataset.tab === "clean-dashboard") renderCleanDashboard(type, allowedTeams);
            if (tab.dataset.tab === "manage") renderManageEvents(type, allowedTeams);
            if (tab.dataset.tab === "players") renderAdminPlayers(type, allowedTeams);
            if (tab.dataset.tab === "teams") renderAdminTeams(type);
          });
        });

        $("#periodFilter")?.addEventListener("change", () => renderEvents(type, allowedTeams));
        $("#typeFilter")?.addEventListener("change", () => renderEvents(type, allowedTeams));

        $("#dashboardPeriodFilter")?.addEventListener("change", () => renderAttendanceDashboard(type, allowedTeams));
        $("#dashboardTypeFilter")?.addEventListener("change", () => renderAttendanceDashboard(type, allowedTeams));

        $("#cleanDashboardPeriodFilter")?.addEventListener("change", () => renderCleanDashboard(type, allowedTeams));
        $("#cleanDashboardTypeFilter")?.addEventListener("change", () => renderCleanDashboard(type, allowedTeams));

        $("#backToEvents")?.addEventListener("click", () => {
          $(`.tab[data-tab="events"]`)?.click();
        });

        $("#markAllPresent")?.addEventListener("click", () => {
          const event = state.data.events.find(e => e.id === state.activeEventId);
          if (!event) return;

          state.data.attendance[event.id] ||= {};
          state.data.players
            .filter(p => p.teamId === event.teamId && p.type === type)
            .forEach(p => state.data.attendance[event.id][p.id] = "present");

          renderAttendancePlayers(type);
        });

        $("#saveAttendance")?.addEventListener("click", () => { saveData(); showToast("Gespeichert."); });
        $("#saveAttendanceBottom")?.addEventListener("click", () => { saveData(); showToast("Gespeichert."); });

        $("#exportCsv")?.addEventListener("click", () => exportCsv(type, allowedTeams));

        const eventTypeSelect = $("#newEventType");
        const updateEventFields = () => {
          const val = eventTypeSelect.value;
          const isMatch = val === "match";
          const isTournament = val === "tournament";

          $("#wrapMatchOpponent")?.classList.toggle("hidden", !isMatch);
          $("#newEventOpponent").required = isMatch;

          $("#wrapTournamentName")?.classList.toggle("hidden", !isTournament);
          $("#newEventTournamentName").required = isTournament;

          $("#wrapTournamentLocation")?.classList.toggle("hidden", !isTournament);
          $("#newEventTournamentLocation").required = isTournament;
        };

        eventTypeSelect?.addEventListener("change", updateEventFields);
        if (eventTypeSelect) updateEventFields();

        const eventMode = $("#newEventMode");
        eventMode?.addEventListener("change", () => {
          const isSeries = eventMode.value === "series";
          $$(".series-field").forEach(f => f.classList.toggle("hidden", !isSeries));
          $("#newEventEndDate").required = isSeries;
        });

        $("#eventForm")?.addEventListener("submit", event => {
          event.preventDefault();
          const targetTeamId = $("#newEventTeam")?.value || state.activeTeamId || allowedTeams[0];
          if (!targetTeamId) { showToast("Kein Team verfügbar."); return; }

          const selectedType = $("#newEventType").value;
          const mode = $("#newEventMode").value;
          const startDate = $("#newEventStartDate").value;
          const endDate = $("#newEventEndDate").value;
          const interval = Number($("#newEventInterval").value || 1);

          let eventTitle = "Training";
          let eventLocation = "";

          if (selectedType === "match") {
            const opponent = $("#newEventOpponent").value.trim();
            eventTitle = `Spiel vs. ${opponent}`;
          } else if (selectedType === "tournament") {
            eventTitle = $("#newEventTournamentName").value.trim();
            eventLocation = $("#newEventTournamentLocation").value.trim();
          }

          const dates = [];
          if (mode === "single") {
            dates.push(startDate);
          } else {
            const date = new Date(`${startDate}T12:00:00`);
            const finalDate = new Date(`${endDate}T12:00:00`);
            while (date <= finalDate && dates.length < 100) {
              dates.push(date.toISOString().slice(0, 10));
              date.setDate(date.getDate() + interval * 7);
            }
          }

          dates.forEach(d => {
            state.data.events.push({
              id: createId("event"),
              teamId: targetTeamId,
              type: selectedType,
              title: eventTitle,
              location: eventLocation,
              date: d
            });
          });

          saveData();
          event.target.reset();
          updateEventFields();
          renderManageEvents(type, allowedTeams);
          renderEvents(type, allowedTeams);
          showToast(dates.length === 1 ? "Termin erstellt." : `${dates.length} Termine erstellt.`);
        });

        $("#teamForm")?.addEventListener("submit", event => {
          event.preventDefault();
          const name = $("#newTeamName").value.trim();
          const trainer = $("#newTeamTrainer").value.trim();
          if (!name || !trainer) return;

          const exists = state.data.teams.some(t => normalizeText(t.name) === normalizeText(name));
          if (exists) { showToast("Dieses Team existiert bereits."); return; }

          state.data.teams.push({
            id: createId("team"),
            name,
            trainer,
            type
          });

          saveData();
          event.target.reset();
          renderApp();
          showToast(`Team ${name} erfolgreich eröffnet.`);
        });

        $("#playerForm")?.addEventListener("submit", event => {
          event.preventDefault();
          const name = $("#newPlayerName").value.trim();
          const trainerTeam = getTrainerTeam();
          const teamId = trainerTeam ? trainerTeam.id : $("#newPlayerTeam")?.value;
          if (!name || !teamId) return;

          state.data.players.push({ id: createId("player"), teamId, name, type });
          saveData();
          $("#newPlayerName").value = "";
          renderAdminPlayers(type, allowedTeams);
          showToast("Spieler hinzugefügt.");
        });

        $("#playerImportForm")?.addEventListener("submit", event => {
          event.preventDefault();
          const file = $("#playerCsvFile").files[0];
          const fallbackTeamId = $("#importPlayerTeam").value;
          if (!file || !fallbackTeamId) return;

          const reader = new FileReader();
          reader.onload = () => {
            const rows = parseCsv(String(reader.result));
            let imported = 0;
            rows.forEach((row, idx) => {
              if (idx === 0 && row[0]?.toLowerCase().includes("name")) return;
              const name = row[0]?.trim();
              if (name) {
                state.data.players.push({ id: createId("player"), teamId: fallbackTeamId, name, type });
                imported++;
              }
            });
            saveData();
            renderAdminPlayers(type, allowedTeams);
            showToast(`${imported} Spieler importiert.`);
          };
          reader.readAsText(file);
        });
      }

      function renderEvents(type, allowedTeams) {
        const selectedPeriod = $("#periodFilter")?.value || "all";
        const selectedType = $("#typeFilter")?.value || "all";

        const events = state.data.events
          .filter(event => {
            const teamMatch = allowedTeams.includes(event.teamId) && (!state.activeTeamId || event.teamId === state.activeTeamId);
            const typeMatch = selectedType === "all" || event.type === selectedType;
            const periodMatch = selectedPeriod === "all" ||
              (selectedPeriod === "upcoming" && event.date >= currentDate()) ||
              (selectedPeriod === "past" && event.date < currentDate());
            return teamMatch && typeMatch && periodMatch;
          })
          .sort((a, b) => a.date.localeCompare(b.date));

        const listEl = $("#eventList");
        if (!listEl) return;

        const typeLabels = { training: "Training", match: "Spiel", tournament: "Turnier" };

        listEl.innerHTML = events.length
          ? events.map(event => {
              const date = new Date(`${event.date}T12:00:00`);
              const count = Object.keys(state.data.attendance[event.id] || {}).length;
              const locPart = event.location ? ` · Ort: ${escapeHtml(event.location)}` : "";

              return `
                <button class="event-button" data-event-id="${event.id}">
                  <span class="event-date">
                    <strong>${String(date.getDate()).padStart(2, "0")}</strong>
                    <span>${date.toLocaleDateString("de-CH", { month: "short" })}</span>
                  </span>
                  <span>
                    <span class="event-name">${escapeHtml(event.title)} (${escapeHtml(teamName(event.teamId))})</span>
                    <span class="event-meta">
                      ${typeLabels[event.type] || "Termin"}${locPart} · ${count} erfasst
                    </span>
                  </span>
                  <span class="event-arrow">›</span>
                </button>
              `;

        $$(".event-button", listEl).forEach(btn => {

      function openAttendance(eventId, type) {
        const event = state.data.events.find(e => e.id === eventId);
        if (!event) return;

        state.activeEventId = eventId;
        state.data.attendance[eventId] ||= {};

        const locPart = event.location ? ` · Ort: ${event.location}` : "";
        $("#attendanceTitle").textContent = event.title;
        $("#attendanceSubtitle").textContent = `${formatDate(event.date)} · ${teamName(event.teamId)}${locPart}`;

        $$(".panel").forEach(p => p.classList.toggle("active", p.id === "attendance"));
        renderAttendancePlayers(type);
      }

      function renderAttendancePlayers(type) {
        const event = state.data.events.find(e => e.id === state.activeEventId);
        if (!event) return;

        const attendance = state.data.attendance[event.id] || {};
        const players = state.data.players
          .filter(p => p.teamId === event.teamId && p.type === type)
          .sort((a, b) => a.name.localeCompare(b.name, "de-CH"));

        $("#playerList").innerHTML = players.length
          ? players.map(player => {
              const activeStatus = attendance[player.id] || "";
              return `
                <div class="player-row">
                  <div>
                    <div class="player-name">${escapeHtml(player.name)}</div>
                    <div class="player-note">${getStatus(activeStatus)?.label || "Noch nicht erfasst"}</div>
                  </div>
                  <div class="status-group">
                    ${statuses.map(status => `
                      <button
                        class="status-button ${activeStatus === status.id ? "active" : ""}"
                        style="--status-color:${status.color}"
                        data-player-id="${player.id}"
                        data-status="${status.id}"
                        title="${status.label}"
                      >${status.short}</button>
                    `).join("")}
                  </div>
                </div>
              `;
            }).join("")
          : `<div class="empty">Keine Spieler für dieses Team vorhanden.</div>`;

        $("#statusLegend").innerHTML = statuses.map(status => `
          <span><i class="dot" style="--dot-color:${status.color}"></i> ${status.short} ${status.label}</span>
        `).join("");

        $$(".status-button").forEach(btn => {
          btn.addEventListener("click", () => {
            const playerId = btn.dataset.playerId;
            const statusId = btn.dataset.status;
            const current = state.data.attendance[state.activeEventId][playerId];
            if (current === statusId) {
              delete state.data.attendance[state.activeEventId][playerId];
            } else {
              state.data.attendance[state.activeEventId][playerId] = statusId;
            }
            renderAttendancePlayers(type);
          });
        });
      }

      function renderAttendanceDashboard(type, allowedTeams) {
        const period = $("#dashboardPeriodFilter")?.value || "all";
        const eventType = $("#dashboardTypeFilter")?.value || "all";
        const events = getFilteredEvents(allowedTeams, period, eventType);
        const rows = getReportRows(events, type, allowedTeams);
        renderDashboardContent("#metricGrid", "#reportTable", events, rows, false);
      }

      function renderCleanDashboard(type, allowedTeams) {
        const period = $("#cleanDashboardPeriodFilter")?.value || "all";
        const eventType = $("#cleanDashboardTypeFilter")?.value || "all";
        const events = getFilteredEvents(allowedTeams, period, eventType);
        const rows = getReportRows(events, type, allowedTeams, ["holiday", "injured", "notCalled"]);
        renderDashboardContent("#cleanMetricGrid", "#cleanReportTable", events, rows, true);
      }

      function getFilteredEvents(allowedTeams, period, eventType) {
        const cutoff = period === "all" ? null : new Date(Date.now() - Number(period) * 86400000);
        return state.data.events.filter(event => {
          const teamMatch = allowedTeams.includes(event.teamId) && (!state.activeTeamId || event.teamId === state.activeTeamId);
          const typeMatch = eventType === "all" || event.type === eventType;
          const dateMatch = !cutoff || new Date(`${event.date}T12:00:00`) >= cutoff;
          return teamMatch && typeMatch && dateMatch;
        });
      }

      function getReportRows(events, type, allowedTeams, excludedStatuses = []) {
        return state.data.players
          .filter(p => p.type === type && allowedTeams.includes(p.teamId) && (!state.activeTeamId || p.teamId === state.activeTeamId))
          .map(player => {
            const playerEvents = events.filter(e => e.teamId === player.teamId);
            const statusesForPlayer = playerEvents.map(e => state.data.attendance[e.id]?.[player.id]).filter(Boolean);
            const excluded = statusesForPlayer.filter(s => excludedStatuses.includes(s)).length;
            const rated = statusesForPlayer.filter(s => !excludedStatuses.includes(s));
            const present = rated.filter(s => getStatus(s)?.present).length;
            const missing = rated.filter(s => s === "missing").length;

            return {
              player,
              recorded: statusesForPlayer.length,
              excluded,
              rated: rated.length,
              present,
              missing,
              rate: rated.length ? Math.round((present / rated.length) * 100) : null
            };
          });
      }

      function renderDashboardContent(metricSelector, tableSelector, events, rows, cleaned) {
        const totalRated = rows.reduce((sum, row) => sum + row.rated, 0);
        const totalPresent = rows.reduce((sum, row) => sum + row.present, 0);
        const totalMissing = rows.reduce((sum, row) => sum + row.missing, 0);
        const totalExcluded = rows.reduce((sum, row) => sum + row.excluded, 0);
        const rate = totalRated ? Math.round((totalPresent / totalRated) * 100) : 0;

        const metricEl = $(metricSelector);
        if (metricEl) {
          metricEl.innerHTML = cleaned ? `
            <div class="card metric"><strong>${events.length}</strong><span>Termine</span></div>
            <div class="card metric"><strong>${totalRated}</strong><span>Bewertet</span></div>
            <div class="card metric"><strong>${rate}%</strong><span>Bereinigt</span></div>
            <div class="card metric"><strong>${totalExcluded}</strong><span>Ausgenommen</span></div>
          ` : `
            <div class="card metric"><strong>${events.length}</strong><span>Termine</span></div>
            <div class="card metric"><strong>${totalRated}</strong><span>Einträge</span></div>
            <div class="card metric"><strong>${rate}%</strong><span>Quote</span></div>
            <div class="card metric"><strong>${totalMissing}</strong><span>Unentschuldigt</span></div>
          `;
        }

        const tableEl = $(tableSelector);
        if (tableEl) {
          tableEl.innerHTML = rows.map(row => {
            const badgeClass = row.rate === null ? "warn" : row.rate >= 85 ? "good" : row.rate >= 70 ? "warn" : "bad";
            const rateLabel = row.rate === null ? "Keine Daten" : `${row.rate}%`;
            return cleaned ? `
              <tr>
                <td>${escapeHtml(row.player.name)}</td>
                <td>${escapeHtml(teamName(row.player.teamId))}</td>
                <td>${row.rated}</td>
                <td><span class="badge ${badgeClass}">${rateLabel}</span></td>
                <td>${row.excluded}</td>
                <td>${row.missing}</td>
              </tr>
            ` : `
              <tr>
                <td>${escapeHtml(row.player.name)}</td>
                <td>${escapeHtml(teamName(row.player.teamId))}</td>
                <td>${row.recorded}</td>
                <td><span class="badge ${badgeClass}">${rateLabel}</span></td>
                <td>${row.missing}</td>
              </tr>
            `;
          }).join("");
        }
      }

      function exportCsv(type, allowedTeams) {
        const typeLabels = { training: "Training", match: "Spiel", tournament: "Turnier" };
        const lines = ["Spieler,Team,Termin,Datum,Art,Status"];
        state.data.events
          .filter(e => allowedTeams.includes(e.teamId) && (!state.activeTeamId || e.teamId === state.activeTeamId))
          .forEach(event => {
            Object.entries(state.data.attendance[event.id] || {}).forEach(([playerId, status]) => {
              const player = state.data.players.find(p => p.id === playerId);
              if (!player) return;
              lines.push([
                player.name,
                teamName(event.teamId),
                event.title,
                event.date,
                typeLabels[event.type] || "Termin",
                getStatus(status)?.label || ""
              ].map(v => `"${String(v).replaceAll('"', '""')}"`).join(","));
            });
          });

        const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `awk-auswertung-${type}.csv`;
        link.click();
        URL.revokeObjectURL(url);
      }

      function parseCsv(text) {
        return text.split(/\r?\n/).filter(Boolean).map(line => line.split(",").map(c => c.replace(/^"|"$/g, "").trim()));
      }

              const date = new Date(`${startDate}T12:00:00`);
              const finalDate = new Date(`${endDate}T12:00:00`);
              while (date <= finalDate && dates.length < 100) {
                dates.push(date.toISOString().slice(0, 10));
                date.setDate(date.getDate() + interval * 7);
              }
            }

            dates.forEach(d => {
              state.data.assignments.push({
                id: createId("assignment"),
                title: "FSA Training",
                category,
                date: d,
                neededHauptleitung: 1,
                neededHelfer,
                status: "open",
                linkToken: createId("lnk")
              });
            });

            saveData();
            if (broadcast) broadcast.postMessage("update");
            event.target.reset();
            $$(".fsa-series-field").forEach(f => f.classList.add("hidden"));
            $(`.tab[data-tab="assignments-list"]`)?.click();
            showToast(dates.length === 1 ? "FSA Training erstellt." : `${dates.length} FSA Trainings erstellt.`);
          } else {
            const title = $("#genAssignmentTitle").value.trim();
            const mode = $("#genAssignmentMode").value;
            const startDate = $("#genAssignmentDate").value;
            const endDate = $("#genAssignmentEndDate")?.value;
            const interval = Number($("#genAssignmentInterval")?.value || 1);
            const neededCount = Number($("#genAssignmentNeeded").value || 1);

            const dates = [];
            if (mode === "single") {
              dates.push(startDate);
            } else {
              const date = new Date(`${startDate}T12:00:00`);
              const finalDate = new Date(`${endDate}T12:00:00`);
              while (date <= finalDate && dates.length < 100) {
                dates.push(date.toISOString().slice(0, 10));
                date.setDate(date.getDate() + interval * 7);
              }
            }

            dates.forEach(d => {
              state.data.assignments.push({
                id: createId("assignment"),
                title,
                category,
                date: d,
                neededCount,
                status: "open",
                linkToken: createId("lnk")
              });
            });

            saveData();
            if (broadcast) broadcast.postMessage("update");
            event.target.reset();
            $$(".gen-series-field").forEach(f => f.classList.add("hidden"));
            $("#genAssignmentNeeded").value = "1";
            $(`.tab[data-tab="assignments-list"]`)?.click();
            showToast(dates.length === 1 ? "Einsatz erstellt." : `${dates.length} Einsätze erstellt.`);
          }
        });

        $("#contactForm")?.addEventListener("submit", event => {
          event.preventDefault();
          const name = $("#contactNameInput").value.trim();
          if (!name) return;

          state.data.contacts.push({
            id: createId("contact"),
            name
          });

          saveData();
          event.target.reset();
          renderContactsList();
          renderAssignmentsModule(moduleId, config);
          $(`.tab[data-tab="contacts-manage"]`)?.click();
          showToast("Trainer hinzugefügt.");
        });

        renderAssignmentList(category, showWhatsApp);
        if (isDSchiri) renderContactsList();
      }

      function renderContactsList() {
        const listEl = $("#contactAdminList");
        if (!listEl) return;

        listEl.innerHTML = state.data.contacts.length ? state.data.contacts.map(c => `
          <div class="admin-item">
            <div>
              <div class="event-name">${escapeHtml(c.name)}</div>
            </div>
            <button class="small-button delete-contact-btn" data-id="${c.id}">Löschen</button>
          </div>
        `).join("") : `<div class="empty">Noch keine Trainer erfasst.</div>`;

        $$(".delete-contact-btn", listEl).forEach(btn => {
          btn.addEventListener("click", () => {
            state.data.contacts = state.data.contacts.filter(c => c.id !== btn.dataset.id);
            saveData();
            renderContactsList();
            showToast("Trainer gelöscht.");
          });
        });
      }

      function renderAssignmentList(category, showWhatsApp = false) {
        const isFSA = category === "FSA Helfer";
        const assignments = state.data.assignments
          .filter(a => a.category === category)
          .sort((a, b) => a.date.localeCompare(b.date));

        const listEl = $("#assignmentList");
        if (!listEl) return;

        listEl.innerHTML = assignments.length ? assignments.map(a => {
          const isPast = a.date < currentDate();
          const signups = state.data.assignmentSignups.filter(s => s.assignmentId === a.id && !s.cancelledAt);

          let isFilled = false;
          let statusText = "Offen";
          let statusClass = "open";

          if (isFSA) {
            const hlSignups = signups.filter(s => s.role === "hauptleitung");
            const helferSignups = signups.filter(s => s.role !== "hauptleitung");
            const neededHL = a.neededHauptleitung ?? 1;
            const neededH = a.neededHelfer ?? 3;

            const hlFull = hlSignups.length >= neededHL;
            const hFull = helferSignups.length >= neededH;
            isFilled = hlFull && hFull;

            if (isFilled) {
              statusText = "Besetzt";
              statusClass = "filled";
            } else if (signups.length > 0) {
              statusText = "Teilbesetzt";
              statusClass = "partial";
            }
          } else {
            const needed = a.neededCount || 1;
            isFilled = signups.length >= needed;
            if (isFilled) {
              statusText = "Besetzt";
              statusClass = "filled";
            } else if (signups.length > 0) {
              statusText = "Teilbesetzt";
              statusClass = "partial";
            }
          }

          const singleLink = `${location.origin}${location.pathname}#einsatz=${a.linkToken}`;

          return `
            <div class="assignment-card ${isPast ? "is-past" : ""}">
              <div class="assignment-head">
                <div>
                  <h4 class="assignment-title">
                    ${escapeHtml(a.title)}
                    ${isPast ? `<span class="badge" style="background:#e2e8f0;color:#64748b;font-size:11px;margin-left:6px;vertical-align:middle;">Vergangen</span>` : ""}
                  </h4>
                  <div class="assignment-meta">
                    📅 <strong>${formatDate(a.date)}</strong>
                    ${a.time ? ` · Anpfiff: ${a.time} Uhr` : ""}
                    ${a.contactName ? `<br>Trainer: ${escapeHtml(a.contactName)}` : ""}
                  </div>
                </div>

                <span class="assignment-status ${statusClass}">
                  <i class="status-dot"></i>
                  ${statusText}
                </span>
              </div>

              ${isFSA ? `
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
                  <span class="slot-count">
                    Hauptleitung: ${signups.filter(s => s.role === "hauptleitung").length} von ${a.neededHauptleitung ?? 1}
                  </span>
                  <span class="slot-count">
                    Helfer: ${signups.filter(s => s.role !== "hauptleitung").length} von ${a.neededHelfer ?? 3}
                  </span>
                </div>
              ` : `
                <div class="slot-count">${signups.length} von ${a.neededCount || 1} Personen eingetragen</div>
              `}

              ${signups.length ? `
                <div class="assignment-signups">
                  <strong>Eingetragene Personen (Admin Ansicht):</strong>
                  <ul>
                    ${signups.map(s => `
                      <li>
                        <span>
                          ${isFSA ? `<span class="role-badge ${s.role === "hauptleitung" ? "hl" : ""}">${s.role === "hauptleitung" ? "Hauptleitung" : "Helfer"}</span>` : ""}
                          <strong>${escapeHtml(s.firstName)} ${escapeHtml(s.lastName)}</strong>
                          ${s.phone ? `· Tel: ${escapeHtml(s.phone)}` : ""}
                        </span>
                        ${isAnyAdmin() ? `<button class="small-button remove-signup-btn" data-signup-id="${s.id}" style="padding:3px 7px;font-size:11px">Entfernen</button>` : ""}
                      </li>
                    `).join("")}
                  </ul>
                </div>
              ` : ""}

              ${isAnyAdmin() ? `
                <div class="assignment-actions">
                  ${!isFilled ? `<button class="button button-primary admin-add-schiri-btn" data-id="${a.id}">Manuell eintragen</button>` : ""}
                  <button class="button button-secondary copy-link-btn" data-link="${singleLink}">Link kopieren</button>
                  ${showWhatsApp ? `<button class="button button-secondary copy-wa-btn" data-title="${escapeHtml(a.title)}" data-date="${formatDate(a.date)}" data-time="${a.time || ''}" data-link="${singleLink}">WhatsApp</button>` : ""}
                  <button class="small-button delete-assign-btn" data-id="${a.id}">Löschen</button>
                </div>

                <div id="adminManualWrap_${a.id}" class="admin-manual-form hidden">
                  <h4 style="margin:0 0 8px 0;font-size:14px">Person manuell eintragen</h4>
                  <form class="admin-direct-signup-form" data-assignment-id="${a.id}">
                    ${isFSA ? `
                      <label style="margin-bottom:8px">
                        Rolle
                        <select name="role" required>
                          <option value="helfer">Helfer</option>
                          <option value="hauptleitung">Hauptleitung</option>
                        </select>
                      </label>
                    ` : ""}
                    <div class="form-grid">
                      <label>Vorname <input name="firstName" required placeholder="Max"></label>
                      <label>Name <input name="lastName" required placeholder="Muster"></label>
                      <label>Telefonnummer <input name="phone" type="tel" required placeholder="079 123 45 67"></label>
                    </div>
                    <div style="margin-top:10px;display:flex;gap:8px">
                      <button class="button button-primary" type="submit">Eintragen</button>
                      <button type="button" class="button button-secondary cancel-manual-btn" data-id="${a.id}">Abbrechen</button>
                    </div>
                  </form>
                </div>
              ` : ""}
            </div>
          `;
        }).join("") : `<div class="card empty">Noch keine Termine oder Einsätze erfasst.</div>`;

        $$(".admin-add-schiri-btn", listEl).forEach(btn => {
          btn.addEventListener("click", () => {
            const formWrap = $(`#adminManualWrap_${btn.dataset.id}`);
            formWrap.classList.toggle("hidden");
          });
        });

        $$(".cancel-manual-btn", listEl).forEach(btn => {
          btn.addEventListener("click", () => {
            const formWrap = $(`#adminManualWrap_${btn.dataset.id}`);
            formWrap.classList.add("hidden");
          });
        });

        $$(".admin-direct-signup-form", listEl).forEach(form => {
          form.addEventListener("submit", event => {
            event.preventDefault();
            const assignmentId = form.dataset.assignmentId;
            const fd = new FormData(form);

            state.data.assignmentSignups.push({
              id: createId("signup"),
              assignmentId,
              role: String(fd.get("role") || "helfer"),
              firstName: String(fd.get("firstName") || "").trim(),
              lastName: String(fd.get("lastName") || "").trim(),
              phone: String(fd.get("phone") || "").trim(),
              managementToken: createId("mgmt"),
              signedUpAt: new Date().toISOString()
            });

            saveData();
            if (broadcast) broadcast.postMessage("update");
            renderAssignmentList(category, showWhatsApp);
            showToast("Erfolgreich eingetragen.");
          });
        });

        $$(".remove-signup-btn", listEl).forEach(btn => {
          btn.addEventListener("click", () => {
            if (!confirm("Person wirklich aus diesem Termin austragen?")) return;
            const signup = state.data.assignmentSignups.find(s => s.id === btn.dataset.signupId);
            if (signup) {
              signup.cancelledAt = new Date().toISOString();
              saveData();
              if (broadcast) broadcast.postMessage("update");
              renderAssignmentList(category, showWhatsApp);
              showToast("Person ausgetragen.");
            }
          });
        });

        $$(".copy-link-btn", listEl).forEach(btn => {
          btn.addEventListener("click", () => {
            navigator.clipboard.writeText(btn.dataset.link);
            showToast("Link kopiert.");
          });
        });

        if (showWhatsApp) {
          $$(".copy-wa-btn", listEl).forEach(btn => {
            btn.addEventListener("click", () => {
              const timeInfo = btn.dataset.time ? ` um ${btn.dataset.time} Uhr` : "";
              const text = `Hallo! Für "${btn.dataset.title}" am ${btn.dataset.date}${timeInfo} suchen wir noch Unterstützung. Bitte trage dich hier ein: ${btn.dataset.link}`;
              navigator.clipboard.writeText(text);
              showToast("WhatsApp Text kopiert.");
            });
          });
        }

        $$(".delete-assign-btn", listEl).forEach(btn => {
          btn.addEventListener("click", () => {
            if (!confirm("Termin wirklich löschen?")) return;
            state.data.assignments = state.data.assignments.filter(x => x.id !== btn.dataset.id);
            state.data.assignmentSignups = state.data.assignmentSignups.filter(x => x.assignmentId !== btn.dataset.id);
            saveData();
            renderAssignmentList(category, showWhatsApp);
            showToast("Gelöscht.");
          });
        });
      }

      /* ÖFFENTLICHE ANSICHT */

      function isPublicRoute() {
        const hash = location.hash.slice(1);
        return hash.startsWith("einsatz=") || hash.startsWith("einsaetze") || hash.startsWith("anmeldung=");
      }

      function renderPublicRoute() {
        const hash = location.hash.slice(1);

        if (hash.startsWith("einsatz=")) {
          const token = hash.replace("einsatz=", "");
          const a = state.data.assignments.find(x => x.linkToken === token);
          renderPublicSingle(a);
        } else if (hash.startsWith("einsaetze")) {
          const rawCat = hash.includes("=") ? hash.split("=")[1] : "";
          const category = rawCat ? decodeURIComponent(rawCat) : null;
          renderPublicOverview(category);
        } else if (hash.startsWith("anmeldung=")) {
          const token = hash.replace("anmeldung=", "");
          renderPublicManageSignup(token);
        }
      }

      function renderPublicOverview(category) {
        const today = currentDate();
        const isFSA = category === "FSA Helfer";
        const assignments = state.data.assignments
          .filter(a => (!category || a.category === category) && a.date >= today)
          .sort((a, b) => `${a.date}${a.time || ''}`.localeCompare(`${b.date}${b.time || ''}`));

        const title = category ? `${category} - Übersicht` : "Offene Einsätze";

          <div class="public-header">
            <div class="brand-mark">FCH</div>
            <h2>${escapeHtml(title)}</h2>
            <p>Wähle einen Termin aus und trage dich verbindlich ein.</p>
          </div>

          <div class="public-body" id="publicOverviewList">
            ${assignments.length ? assignments.map(a => {
              const signups = state.data.assignmentSignups.filter(s => s.assignmentId === a.id && !s.cancelledAt);

                const hlSignups = signups.filter(s => s.role === "hauptleitung");

                const neededH = a.neededHelfer ?? 3;

                const hFull = helferSignups.length >= neededH;

                      <span class="assignment-status ${isAllFull ? "filled" : (signups.length > 0 ? "partial" : "open")}">

                      <div id="formWrap_${a.id}">

                              ${!hlFull ? `<option value="hauptleitung">Hauptleitung (1 Person)</option>` : ""}

                          </div>
                          <button class="button button-primary" type="submit">Verbindlich eintragen</button>
                        </form>
                      </div>
                    `}

          </div>
        `;

        $$(".show-form-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const form = $(`#form_${btn.dataset.id}`);
            form.classList.remove("hidden");
            btn.classList.add("hidden");
          });
        });

        $$(".signup-form").forEach(form => {
          form.addEventListener("submit", event => {
            event.preventDefault();
            const assignmentId = form.dataset.assignmentId;

            if (!a) return;

            const token = createId("mgmt");

              role: String(fd.get("role") || "helfer"),

      function renderPublicSingle(assignment) {
        const content = $("#publicContent");
        if (!assignment) {
          content.innerHTML = `
            <div class="public-header"><div class="brand-mark">FCH</div><h2>Einsatz nicht gefunden</h2></div>
            <div class="public-body"><div class="card empty">Dieser Link ist nicht mehr gültig.</div></div>
          `;
          return;
        }

        const isPast = assignment.date < currentDate();
        const isFSA = assignment.category === "FSA Helfer";
        const signups = state.data.assignmentSignups.filter(s => s.assignmentId === assignment.id && !s.cancelledAt);

        let isAllFull = false;
        let hlFull = false;
        let hFull = false;
        let hlNames = "";
        let hNames = "";

          isAllFull = hlFull && hFull;

          isAllFull = signups.length >= (assignment.neededCount || 1);
        }

        content.innerHTML = `
          <div class="public-header">
            <div class="brand-mark">FCH</div>
            <h2>FCH Helfer-Einschreibung</h2>
            <p>Freiwilliger Einsatz im Verein</p>
          </div>

          <div class="public-body">
            <div class="card">
              <h2>${escapeHtml(assignment.title)}</h2>
              <div class="assignment-meta">

                ${assignment.time ? ` · Anpfiff: <strong>${assignment.time} Uhr</strong>` : ""}
                ${assignment.contactName ? `<br>Trainer: ${escapeHtml(assignment.contactName)}` : ""}

              ${isFSA ? `
                <div style="margin:14px 0;font-size:14px;line-height:1.6">
                  <div><strong>Hauptleitung (1):</strong> ${hlFull ? `<span style="color:var(--success);font-weight:700">Besetzt (${hlNames})</span>` : `<span style="color:var(--danger);font-weight:700">Noch offen</span>`}</div>
                  <div><strong>Helfer (${neededH}):</strong> ${signups.filter(s => s.role !== "hauptleitung").length} von ${neededH} besetzt ${hNames ? `(${hNames})` : ""}</div>
                </div>
              ` : `
                <div class="slot-count" style="margin-bottom:14px;margin-top:14px">
                  ${signups.length} von ${assignment.neededCount || 1} Plätzen besetzt
                </div>
              `}

              ${isPast ? `
                <div class="notice" style="margin:0">Dieser Termin hat bereits in der Vergangenheit stattgefunden.</div>
              ` : isAllFull ? `
                <div class="notice" style="margin:0">Dieser Termin ist bereits vollständig besetzt. Vielen Dank!</div>
              ` : `
                <form id="publicSignupForm" class="signup-form">
                  ${isFSA ? `
                    <label>
                      Rolle auswählen
                      <select name="role" required>
                        ${!hlFull ? `<option value="hauptleitung">Hauptleitung (1 Person)</option>` : ""}
                        ${!hFull ? `<option value="helfer" selected>Helfer</option>` : ""}
                      </select>
                    </label>
                  ` : ""}
                  <div class="form-grid">
                    <label>Vorname <input name="firstName" required placeholder="Max"></label>
                    <label>Name <input name="lastName" required placeholder="Muster"></label>
                    <label>Telefonnummer <input name="phone" type="tel" required placeholder="079 123 45 67"></label>
                  </div>
                  <button class="button button-primary" type="submit">Verbindlich eintragen</button>
                </form>
              `}

              <div style="margin-top:16px;text-align:center">
                <a href="${location.origin}${location.pathname}#einsaetze=${encodeURIComponent(assignment.category)}" style="color:var(--blue);font-size:13px;font-weight:700">‹ Alle offenen ${escapeHtml(assignment.category)}-Termine anzeigen</a>
              </div>
            </div>
          </div>
        `;

        $("#publicSignupForm")?.addEventListener("submit", event => {
          event.preventDefault();
          const fd = new FormData(event.target);
          const token = createId("mgmt");

          state.data.assignmentSignups.push({
            id: createId("signup"),
            assignmentId: assignment.id,
            role: String(fd.get("role") || "helfer"),
            firstName: String(fd.get("firstName") || "").trim(),
            lastName: String(fd.get("lastName") || "").trim(),
            phone: String(fd.get("phone") || "").trim(),
            managementToken: token,
            signedUpAt: new Date().toISOString()
          });

          saveData();
          if (broadcast) broadcast.postMessage("update");

          event.target.innerHTML = `
            <div class="notice" style="margin:0">
              <strong>Danke für deine Unterstützung!</strong><br>
              Du bist verbindlich eingetragen.<br><br>
              <a href="${location.origin}${location.pathname}#anmeldung=${token}" style="font-weight:700;color:var(--blue)">Anmeldung verwalten oder abmelden</a>
            </div>
          `;
        });
      }

      function renderPublicManageSignup(token) {
        const signup = state.data.assignmentSignups.find(s => s.managementToken === token && !s.cancelledAt);
        const content = $("#publicContent");

        if (!signup) {
          content.innerHTML = `
            <div class="public-header"><div class="brand-mark">FCH</div><h2>Anmeldung</h2></div>
            <div class="public-body"><div class="card empty">Anmeldung nicht gefunden oder bereits abgemeldet.</div></div>
          `;
          return;
        }

        const assignment = state.data.assignments.find(a => a.id === signup.assignmentId);

        content.innerHTML = `
          <div class="public-header"><div class="brand-mark">FCH</div><h2>Einsatz Details</h2></div>
          <div class="public-body">
            <div class="card">
              <h3>${escapeHtml(assignment?.title || "Termin")}</h3>
              <p class="assignment-meta">
                ${assignment ? `📅 ${formatDate(assignment.date)}${assignment.time ? ` · Anpfiff: ${assignment.time} Uhr` : ''}` : ""}
              </p>
              <p class="assignment-meta">
                ${signup.role === "hauptleitung" ? "Rolle: <strong>Hauptleitung</strong><br>" : (signup.role === "helfer" ? "Rolle: <strong>Helfer</strong><br>" : "")}
                Eingetragen: <strong>${escapeHtml(signup.firstName)} ${escapeHtml(signup.lastName)}</strong>
                ${signup.phone ? `<br>Telefon: ${escapeHtml(signup.phone)}` : ""}
              </p>
              <button class="button button-danger" id="cancelSignupBtn">Vom Termin abmelden</button>
            </div>
          </div>
        `;

        $("#cancelSignupBtn").addEventListener("click", () => {
          if (!confirm("Möchtest du dich wirklich von diesem Termin abmelden?")) return;
          signup.cancelledAt = new Date().toISOString();
          saveData();
          if (broadcast) broadcast.postMessage("update");
          renderPublicManageSignup(token);
          showToast("Erfolgreich abgemeldet.");
        });
      }

      let toastTimer;
      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
      }

      if (broadcast) {
        broadcast.onmessage = () => {
          state.data = loadData();
          if (isPublicRoute()) renderPublicRoute();
          else if (state.activeModule !== "dashboard") renderModule(state.activeModule);
        };
      }

      window.addEventListener("hashchange", () => renderApp());

      renderApp();
    })();
  </script>
</body>
</html>
